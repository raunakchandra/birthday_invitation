<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited to a birthday party!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcebfa;--env:#8ebbea;--flap:#6fa5de;--paper:#fffdf7;--ink:#1b2a4a;--sun:#ffc93c;--coral:#ff6b5b;--mute:#5a6b8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b33;--env:#3f6aa3;--flap:#33598d;--paper:#fff8e6;--mute:#5a6b8c}}
:root[data-theme="dark"]{--bg:#0f1b33;--env:#3f6aa3;--flap:#33598d;--paper:#fff8e6;--mute:#5a6b8c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;display:grid;place-items:center;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.stage{position:relative;width:min(92vw,340px);aspect-ratio:3/2.1;perspective:900px;transition:opacity .6s,transform .6s}
.stage.gone{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}
.env{position:absolute;inset:0;background:var(--env);border-radius:10px;box-shadow:0 18px 30px -12px rgba(15,27,51,.45)}
.note{position:absolute;left:8%;right:8%;top:8%;height:84%;background:var(--paper);border-radius:6px;padding:16px;font:600 22px/1.2 Caveat,cursive;color:var(--ink);transition:transform .9s .5s cubic-bezier(.3,1.3,.5,1);z-index:1}
.note small{display:block;margin-top:6px;font-size:18px;color:var(--mute)}
.pocket{position:absolute;inset:0;z-index:2;border-radius:10px;background:var(--env);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);filter:brightness(1.06)}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:3;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s,z-index 0s .3s;border-radius:10px 10px 0 0}
.seal{position:absolute;z-index:4;left:50%;top:44%;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;border-radius:50%;background:var(--coral);color:#fff;font:700 30px Fredoka,sans-serif;cursor:pointer;box-shadow:0 4px 0 #c9483a;transition:transform .25s,opacity .3s;animation:pulse 1.8s ease-in-out infinite}
.seal:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.1)}}
.hint{position:absolute;left:0;right:0;bottom:-44px;text-align:center;font:600 22px Caveat,cursive;color:var(--mute)}
.open .seal{opacity:0;transform:scale(1.8);animation:none;pointer-events:none}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .note{transform:translateY(-62%)}
.open .hint{opacity:0}
.card{position:absolute;width:min(92vw,400px);max-height:94%;overflow:auto;background:var(--paper);border-radius:22px;padding:28px 24px 22px;text-align:center;box-shadow:0 24px 50px -16px rgba(15,27,51,.5);opacity:0;transform:translateY(40px) scale(.92) rotate(-2deg);pointer-events:none;transition:opacity .7s,transform .8s cubic-bezier(.3,1.4,.5,1)}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .top{font:600 24px Caveat,cursive;color:var(--coral)}
.eight{display:block;margin:2px auto 0;border:0;background:none;cursor:pointer;font:700 clamp(84px,26vw,118px)/1 Fredoka,sans-serif;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--coral);transition:transform .2s}
.eight:active{transform:scale(.92) rotate(-6deg)}
.eight:focus-visible{outline:3px solid var(--coral);outline-offset:6px;border-radius:20px}
h1{font-size:clamp(22px,6vw,28px);font-weight:700;line-height:1.15;margin:4px 0 14px}
.when{display:inline-block;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 20px;font-weight:700;font-size:19px}
.det{margin:16px auto 0;max-width:300px;font-size:17px;line-height:1.5;color:var(--ink)}
.det b{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:8px}
.count{margin-top:16px;font:600 22px Caveat,cursive;color:var(--coral)}
.again{margin-top:12px;border:0;background:none;color:var(--mute);font:500 14px Fredoka,sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
.bunt{display:block;width:calc(100% + 48px);height:46px;margin:-28px -24px 8px}
.hero{position:relative}
.bl{position:absolute;width:44px;height:80px;animation:bob 4s ease-in-out infinite}
.bl.a{left:-6px;top:10px;color:var(--coral)}.bl.b{left:26px;top:52px;color:#6fa5de;animation-delay:-1.5s;width:36px;height:66px}
.bl.c{right:-6px;top:6px;color:#7ed6a4;animation-delay:-.8s}.bl.d{right:26px;top:56px;color:var(--sun);animation-delay:-2.4s;width:36px;height:66px}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.fun{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:12px}
.fun svg{height:84px;width:auto}.fun .cake{height:104px}
.pick{margin-top:16px}.pt{font:600 22px Caveat,cursive;color:var(--mute)}
.gifts{display:flex;justify-content:center;gap:12px;margin-top:6px}
.g{width:52px;height:52px;border:0;border-radius:10px;background:var(--c);position:relative;cursor:pointer;box-shadow:0 4px 0 rgba(27,42,74,.25);transition:transform .2s}
.g::before{content:"";position:absolute;left:calc(50% - 5px);top:0;bottom:0;width:10px;background:rgba(255,255,255,.85)}
.g::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 5px);height:10px;background:rgba(255,255,255,.85)}
.g:hover{transform:translateY(-4px) rotate(-4deg)}.g:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.g.on{transform:translateY(-8px) rotate(6deg)}
.peek{margin:12px auto 0;min-height:44px;max-width:260px;font-weight:700;font-size:18px;line-height:1.25;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="stage" id="stage">
  <div class="env">
    <div class="note">Psst… a secret<br>is inside!<small>(it's a party)</small></div>
    <div class="pocket"></div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open the invitation">★</button>
  </div>
  <div class="hint">tap the seal</div>
</div>

<main class="card" id="card" aria-live="polite">
  <svg class="bunt" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6Q200 54 400 6" fill="none" stroke="#5a6b8c" stroke-width="2"/>
    <polygon points="7,9 43,9 25,43" fill="#ff6b5b"/><polygon points="57,14 93,14 75,48" fill="#ffc93c"/>
    <polygon points="107,17 143,17 125,51" fill="#6fa5de"/><polygon points="157,18 193,18 175,52" fill="#7ed6a4"/>
    <polygon points="207,18 243,18 225,52" fill="#ff6b5b"/><polygon points="257,17 293,17 275,51" fill="#ffc93c"/>
    <polygon points="307,14 343,14 325,48" fill="#6fa5de"/><polygon points="357,9 393,9 375,43" fill="#7ed6a4"/>
  </svg>
  <div class="top">You're invited to a party!</div>
  <div class="hero">
    <svg class="bl a" aria-hidden="true"><use href="#bln"/></svg><svg class="bl b" aria-hidden="true"><use href="#bln"/></svg>
    <svg class="bl c" aria-hidden="true"><use href="#bln"/></svg><svg class="bl d" aria-hidden="true"><use href="#bln"/></svg>
    <button class="eight" id="eight" aria-label="Pop confetti">Yay!</button>
  </div>
  <h1>Come celebrate <span id="who">our little champ</span>'s birthday</h1>
  <div class="when">16 October</div>
  <div class="det">
    <b>Time</b><span id="time">4:00 PM onwards</span>
    <b>Place</b><span id="place">Our home, come hungry</span>
  </div>
  <div class="pick">
    <div class="pt">Tap a gift to peek inside!</div>
    <div class="gifts">
      <button class="g" data-m="Yummy cake with lots of candles" style="--c:#ff6b5b" aria-label="Gift 1"></button>
      <button class="g" data-m="Silly games and prizes to win" style="--c:#6fa5de" aria-label="Gift 2"></button>
      <button class="g" data-m="Music, dancing and balloons everywhere" style="--c:#7ed6a4" aria-label="Gift 3"></button>
      <button class="g" data-m="A big surprise… shhh, it's a secret!" style="--c:#ffc93c" aria-label="Gift 4"></button>
    </div>
    <div class="peek" id="peek">&nbsp;</div>
  </div>
  <div class="count" id="count"></div>
  <div class="fun" aria-hidden="true">
    <svg viewBox="0 0 80 84"><rect x="10" y="38" width="60" height="42" rx="5" fill="#6fa5de"/><rect x="6" y="28" width="68" height="16" rx="5" fill="#ffc93c"/><rect x="35" y="28" width="10" height="52" fill="#ff6b5b"/><ellipse cx="28" cy="18" rx="14" ry="9" fill="#ff6b5b" transform="rotate(-20 28 18)"/><ellipse cx="52" cy="18" rx="14" ry="9" fill="#ff6b5b" transform="rotate(20 52 18)"/><circle cx="40" cy="25" r="6" fill="#c9483a"/></svg>
    <svg class="cake" viewBox="0 0 120 104"><ellipse cx="60" cy="96" rx="56" ry="7" fill="#1b2a4a" opacity=".15"/><rect x="8" y="64" width="104" height="30" rx="8" fill="#ff6b5b"/><path d="M8 72q10 12 20 0t20 0t20 0t20 0t20 0t16 0v-4H8z" fill="#fffdf7"/><rect x="26" y="38" width="68" height="28" rx="8" fill="#6fa5de"/><path d="M26 46q8 10 17 0t17 0t17 0t17 0v-4H26z" fill="#fffdf7"/><g fill="#ffc93c"><rect x="38" y="20" width="6" height="19" rx="2"/><rect x="57" y="20" width="6" height="19" rx="2"/><rect x="76" y="20" width="6" height="19" rx="2"/></g><g fill="#ff9a3c"><path d="M41 6q6 7 0 12q-6-5 0-12z"/><path d="M60 6q6 7 0 12q-6-5 0-12z"/><path d="M79 6q6 7 0 12q-6-5 0-12z"/></g><g fill="#7ed6a4"><circle cx="24" cy="80" r="3"/><circle cx="56" cy="84" r="3"/><circle cx="90" cy="80" r="3"/></g><g fill="#ffc93c"><circle cx="40" cy="55" r="2.5"/><circle cx="70" cy="57" r="2.5"/></g></svg>
    <svg viewBox="0 0 70 84"><polygon points="35,8 64,80 6,80" fill="#ff6b5b"/><path d="M22 46l32 0M16 62l44 0" stroke="#ffc93c" stroke-width="7"/><circle cx="35" cy="8" r="7" fill="#ffc93c"/><circle cx="35" cy="30" r="3.5" fill="#fffdf7"/><circle cx="26" cy="72" r="3.5" fill="#6fa5de"/><circle cx="44" cy="72" r="3.5" fill="#6fa5de"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bln" viewBox="0 0 50 90"><ellipse cx="25" cy="28" rx="20" ry="25" fill="currentColor"/><path d="M21 52l4 7 4-7z" fill="currentColor"/><path d="M25 59c-7 9 7 14 0 29" stroke="#5a6b8c" fill="none" stroke-width="1.6"/><ellipse cx="16" cy="18" rx="4.5" ry="8" fill="#fff" opacity=".4" transform="rotate(25 16 18)"/></symbol></svg>
  <button class="again" id="again">Close the letter</button>
</main>

<script>
// ✏️ Edit these four lines to personalise the invitation
var NAME="our little champ", TIME="4:00 PM onwards", PLACE="Our home, come hungry";
var t0=new Date(),PARTY=new Date(t0.getFullYear(),9,16);
if(PARTY<new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()))PARTY.setFullYear(t0.getFullYear()+1);

var $=function(i){return document.getElementById(i)};
$("who").textContent=NAME;$("time").textContent=TIME;$("place").textContent=PLACE;

var d=Math.ceil((PARTY-new Date().setHours(0,0,0,0))/864e5);
$("count").textContent=d>1?d+" sleeps to go!":d===1?"Tomorrow is the day!":d===0?"It's today! 🎉":"";

var cv=$("c"),x=cv.getContext("2d"),bits=[],run=false;
var cols=["#ffc93c","#ff6b5b","#6fa5de","#7ed6a4","#ffffff"];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
size();addEventListener("resize",size);
function burst(px,py,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    bits.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6,w:5+Math.random()*6,h:8+Math.random()*8,c:cols[i%5],l:110+Math.random()*60});}
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  x.clearRect(0,0,cv.width,cv.height);var k=devicePixelRatio;
  bits=bits.filter(function(b){return b.l>0});
  bits.forEach(function(b){b.vy+=.28;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;b.r+=.2;b.l--;
    x.save();x.translate(b.x*k,b.y*k);x.rotate(b.r);x.globalAlpha=Math.min(1,b.l/30);x.fillStyle=b.c;x.fillRect(-b.w*k/2,-b.h*k/2,b.w*k,b.h*k);x.restore()});
  if(bits.length)requestAnimationFrame(tick);else{run=false;x.clearRect(0,0,cv.width,cv.height)}
}

var stage=$("stage"),card=$("card");
$("seal").onclick=function(){
  stage.classList.add("open");
  setTimeout(function(){stage.classList.add("gone");card.classList.add("show");
    burst(innerWidth/2,innerHeight*.42,150)},1500);
};
$("eight").onclick=function(e){var r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,70)};
document.querySelectorAll(".g").forEach(function(g){g.onclick=function(){
  document.querySelectorAll(".g").forEach(function(o){o.classList.remove("on")});g.classList.add("on");
  $("peek").textContent=g.dataset.m;var r=g.getBoundingClientRect();burst(r.left+r.width/2,r.top,35)}});
$("again").onclick=function(){card.classList.remove("show");stage.classList.remove("gone");setTimeout(function(){stage.classList.remove("open")},500)};
</script>
</body>
</html>
